name: Sync vaults and strategies

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  sync-vaults-and-strategies:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Load RPC URLs from Doppler
        uses: dopplerhq/secrets-fetch-action@451892f16195f9ac360e1a5bcbf0b5fd0e957534 # v2.0.0
        with:
          auth-method: oidc
          doppler-identity-id: ${{ vars.DOPPLER_PRODUCTION_IDENTITY_ID }}
          doppler-project: cms
          doppler-config: sync
          inject-env-vars: true

      - name: Run sync-vaults.ts
        run: bun run scripts/sync-vaults.ts
        working-directory: packages/app

      - name: Run sync-strategies.ts
        run: bun run scripts/sync-strategies.ts
        working-directory: packages/app

      - name: Run sync-tokens.ts
        run: bun run scripts/sync-tokens.ts
        working-directory: packages/app

      - name: Check for changes
        id: verify-changed-files
        run: |
          if [ -n "$(git status --porcelain packages/cdn/)" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add packages/cdn/vaults/
          git add packages/cdn/strategies/
          git add packages/cdn/tokens/
          git commit -m "🤖 Sync vaults, strategies and tokens"
          git push
